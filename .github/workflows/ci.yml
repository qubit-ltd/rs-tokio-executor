name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapter-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out executor
        uses: actions/checkout@v4
        with:
          repository: qubit-ltd/rs-executor
          ref: 92e7e6abf8010df4846ae2e1649d6aab535c55aa
          path: rs-executor
      - name: Check out Rayon adapter
        uses: actions/checkout@v4
        with:
          repository: qubit-ltd/rs-rayon-executor
          ref: 2caaa944acf2fb4dab977200b517ba1f59a759ce
          path: rs-rayon-executor
      - name: Check out Tokio adapter
        uses: actions/checkout@v4
        with:
          repository: qubit-ltd/rs-tokio-executor
          ref: 9228b957a95df7512873d5762431839f1e567b52
          path: rs-tokio-executor
      - name: Check out thread pool
        uses: actions/checkout@v4
        with:
          repository: qubit-ltd/rs-thread-pool
          ref: b18562cfdc29fe53bc16a683927049cecdb4c08b
          path: rs-thread-pool
      - name: Install project Rust toolchain
        working-directory: rs-executor
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check fixture dependency baseline
        working-directory: rs-executor
        run: |
          ln -s ../../.infra tests/adapter_contracts/.infra
          ./.infra/bin/infra-tool.sh rs-infra-dependency --project tests/adapter_contracts check
      - name: Run adapter contract tests
        working-directory: rs-executor
        run: cargo test --locked --manifest-path tests/adapter_contracts/Cargo.toml

  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
